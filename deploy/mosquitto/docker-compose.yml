# Isolated stack. Do not run docker compose from bot directories.
# On the Oracle VM: cd ~/zerodata-mqtt && docker compose up -d
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: zerodata-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  mosquitto-data:

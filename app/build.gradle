plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.0'
    id 'com.google.devtools.ksp'
    id 'jacoco'
}

android {
    namespace 'com.zerodata.chat'
    compileSdk 35

    defaultConfig {
        applicationId "com.zerodata.chat"
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName "0.3.0-pre.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Broker URI: GitHub Actions env MQTT_SERVER_URI, else gitignored local.properties, else public EMQX.
        // local.properties: mqtt.server.uri=tcp://YOUR_ORACLE_IP:1883
        def mqttUri = System.getenv("MQTT_SERVER_URI")
        if (mqttUri == null || mqttUri.trim().isEmpty()) {
            mqttUri = "tcp://broker.emqx.io:1883"
            def localFile = rootProject.file("local.properties")
            if (localFile.exists()) {
                def props = new Properties()
                localFile.withInputStream { props.load(it) }
                def overrideUri = props.getProperty("mqtt.server.uri")
                if (overrideUri != null && !overrideUri.trim().isEmpty()) {
                    mqttUri = overrideUri.trim()
                }
            }
        } else {
            mqttUri = mqttUri.trim()
        }
        buildConfigField "String", "MQTT_SERVER_URI", "\"${mqttUri}\""
    }

    def uploadStoreFile = System.getenv("SIGNING_STORE_FILE")
    def uploadStore = (uploadStoreFile != null && file(uploadStoreFile).exists()) ? file(uploadStoreFile) : null

    signingConfigs {
        upload {
            if (uploadStore != null) {
                storeFile uploadStore
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            enableUnitTestCoverage true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (uploadStore != null) {
                signingConfig signingConfigs.upload
            }
        }
    }
    
    lintOptions {
        abortOnError false
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

ksp {
    arg("room.incremental", "false")
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.10.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    
    // Room
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    
    // MQTT
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'com.github.hannesa2:paho.mqtt.android:4.4.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    
    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.8.3'
    
    // ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    
    // Serialization
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    
    // Koin
    implementation "io.insert-koin:koin-android:3.5.6"
    implementation "io.insert-koin:koin-androidx-compose:3.5.6"
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation "io.mockk:mockk:1.13.12"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0"
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.10.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Network & Updates
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // Logging
    implementation 'com.jakewharton.timber:timber:5.0.1'
}

tasks.withType(Test).configureEach {
    jacoco {
        includeNoLocationClasses true
        excludes = ['jdk.internal.*']
    }
}

def jacocoExcludes = [
    '**/R.class',
    '**/R$*.class',
    '**/BuildConfig.*',
    '**/Manifest*.*',
    '**/*Test*.*',
    '**/databinding/**',
    '**/*_Impl*.*',
    '**/*_Factory*.*',
]

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    group = 'verification'
    description = 'JaCoCo HTML/XML report for debug unit tests'

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    def kotlinClasses = fileTree(dir: layout.buildDirectory.dir('tmp/kotlin-classes/debug'), excludes: jacocoExcludes)
    def javaClasses = fileTree(dir: layout.buildDirectory.dir('intermediates/javac/debug/classes'), excludes: jacocoExcludes)
    classDirectories.setFrom(files([kotlinClasses, javaClasses]))
    sourceDirectories.setFrom(files(['src/main/java']))
    executionData.setFrom(fileTree(dir: layout.buildDirectory, includes: [
        'jacoco/testDebugUnitTest.exec',
        'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
    ]))
}

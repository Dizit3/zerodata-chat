name: Build Android APK

on:
  push:
    branches: [ "dev", "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "dev", "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MQTT_SERVER_URI: ${{ vars.MQTT_SERVER_URI || 'tcp://129.151.220.171:1883' }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode upload keystore
      if: github.ref_type == 'tag'
      env:
        SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      run: |
        mkdir -p keystore
        echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > keystore/upload.jks

    - name: Run Tests
      run: ./gradlew test jacocoTestReport

    - name: Upload JaCoCo report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: app/build/reports/jacoco/jacocoTestReport/

    - name: Build debug APK
      if: github.ref_type != 'tag'
      run: ./gradlew assembleDebug --build-cache --parallel -x lint

    - name: Build signed release APK
      if: github.ref_type == 'tag'
      env:
        SIGNING_STORE_FILE: ${{ github.workspace }}/keystore/upload.jks
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: ./gradlew assembleRelease --build-cache --parallel -x lint

    - name: Upload debug artifact
      if: github.ref_type != 'tag'
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Prepare release APK
      if: github.ref_type == 'tag'
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk "dist/ZeroDataChat-${GITHUB_REF_NAME}.apk"

    - name: GitHub Release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/ZeroDataChat-${{ github.ref_name }}.apk
        prerelease: ${{ contains(github.ref_name, '-pre') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
        generate_release_notes: true
        name: ${{ github.ref_name }}
        fail_on_unmatched_files: true
